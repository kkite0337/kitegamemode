<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="kite">
  <title>kite</title>
  <link rel="canonical" href="https://kitegamemode.kr/">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=262">
</head>
<body>
  <main class="app">
    <section class="page login-page" id="loginPage">
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="loginId">아이디</label>
          <input id="loginId" type="text" autocomplete="username" placeholder="아이디" required>
        </div>
        <div class="login-field">
          <label for="loginPassword">비밀번호</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        </div>
        <p class="login-error" id="loginError" hidden>잘못입력하셨습니다</p>
        <button class="btn-primary" type="submit">로그인</button>
      </form>
    </section>

    <section class="page home-page" id="homePage" hidden>
      <header class="page-top" id="homeHeader">
        <div class="page-top-left">
          <p class="page-role" id="homeLabel"></p>
          <button class="btn-text" type="button" id="logoutBtn">로그아웃</button>
        </div>
        <nav class="page-tabs" aria-label="페이지 전환">
          <button class="page-tab" type="button" data-section="routine">루틴</button>
          <button class="page-tab is-active" type="button" data-section="economy">경제</button>
          <button class="page-tab" type="button" data-section="language">언어</button>
        </nav>
        <div class="page-top-right" id="headerActions">
          <div class="header-actions" id="economyActions">
            <button class="btn-plus" type="button" id="addMemoBtn" aria-label="메모 추가">+</button>
            <button class="btn-pdf" type="button" id="pdfBtn">PDF</button>
          </div>
          <div class="header-actions is-hidden" id="languageActions">
            <button class="btn-plus" type="button" id="addLangBtn" aria-label="언어 추가">+</button>
            <button class="btn-pdf" type="button" id="langPdfBtn">PDF</button>
          </div>
          <div class="header-actions is-hidden" id="routineActions">
            <button class="btn-plus" type="button" id="addRoutineBtn" aria-label="루틴 추가">+</button>
          </div>
        </div>
      </header>

      <div class="home-section" id="sectionRoutine" hidden>
        <div class="routine-view" id="routineView">
          <div class="routine-week-nav">
            <button class="calendar-nav" type="button" id="routineWeekPrev" aria-label="이전 주">‹</button>
            <h1 class="routine-week-title" id="routineWeekTitle"></h1>
            <button class="calendar-nav" type="button" id="routineWeekNext" aria-label="다음 주">›</button>
          </div>
          <div class="routine-main">
            <aside class="routine-col" id="routineLeft" aria-label="루틴 왼쪽">
              <div class="side-panel__box side-panel__box--rate" id="cleaningBox">
                <div class="side-box-head">
                  <h2 class="side-box-title">청소</h2>
                </div>
                <div class="clean-list" id="cleaningList"></div>
              </div>
              <div class="side-panel__box side-panel__box--rate" id="exerciseBox">
                <div class="side-box-head">
                  <h2 class="side-box-title">운동</h2>
                </div>
                <div class="exercise-list" id="exerciseList"></div>
              </div>
            </aside>
            <div class="routine-col" id="routineRight" aria-label="루틴 오른쪽">
              <div class="routine-board" id="routineBoard">
                <div class="routine-days" id="routineDays" aria-hidden="true"></div>
                <div class="routine-list" id="routineList"></div>
              </div>
              <p class="routine-empty" id="routineEmpty" hidden>+ 버튼으로 루틴을 추가하세요</p>
            </div>
          </div>
        </div>
      </div>

      <div class="home-section" id="sectionLanguage" hidden>
        <div class="home-main" id="languageView">
          <aside class="side-panel" aria-label="언어 요약">
            <div class="side-panel__box side-panel__box--rate">
              <div class="side-box-head">
                <h2 class="side-box-title">달성률</h2>
              </div>
              <div class="achieve-body">
                <p class="achieve-percent"><span id="langAchievePercent">0</span>%</p>
                <p class="achieve-count" id="langAchieveCount">0일 / 0일</p>
                <div class="achieve-bar" aria-hidden="true">
                  <div class="achieve-bar__fill" id="langAchieveBarFill"></div>
                </div>
              </div>
            </div>
            <div class="side-panel__box side-panel__box--rate" id="langStudyBox">
              <div class="side-box-head">
                <h2 class="side-box-title">공부시간</h2>
              </div>
              <div class="study-time-body">
                <p class="study-time-total" id="langStudyTotal">0분</p>
                <p class="study-time-hint" id="langStudyHint">이번 달 총 공부시간</p>
              </div>
            </div>
          </aside>
          <div class="home-right">
            <div class="calendar" id="langCalendar" aria-label="언어 캘린더">
              <div class="calendar-header">
                <button class="calendar-nav" type="button" id="langCalendarPrev" aria-label="이전 달">‹</button>
                <h1 class="calendar-title" id="langCalendarTitle"></h1>
                <button class="calendar-nav" type="button" id="langCalendarNext" aria-label="다음 달">›</button>
              </div>
              <div class="calendar-weekdays" aria-hidden="true">
                <span>일</span>
                <span>월</span>
                <span>화</span>
                <span>수</span>
                <span>목</span>
                <span>금</span>
                <span>토</span>
              </div>
              <div class="calendar-grid" id="langCalendarGrid"></div>
            </div>
            <div class="day-detail" id="langDayDetail">
              <p class="day-detail__hint" id="langDayDetailHint">날짜를 선택하면 저장된 내용이 여기에 표시됩니다.</p>
              <div class="day-detail__content" id="langDayDetailContent" hidden>
                <h2 class="day-detail__title" id="langDayDetailTitle"></h2>
                <div class="day-detail__list" id="langDayDetailList"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="memo-view" id="langFormView" hidden>
          <header class="memo-top">
            <button class="btn-text" type="button" id="langFormBackBtn">닫기</button>
            <div class="memo-actions">
              <button class="btn-action" type="button" id="langDraftListBtn">저장목록</button>
              <span class="memo-actions__sep" aria-hidden="true">|</span>
              <button class="btn-action" type="button" id="langDraftSaveBtn">임시저장</button>
              <span class="memo-actions__sep" aria-hidden="true">|</span>
              <button class="btn-action is-strong" type="button" id="langFormSaveBtn">저장</button>
            </div>
          </header>
          <form class="memo-form" id="langForm">
            <div class="memo-field">
              <span class="memo-label">날짜</span>
              <div class="date-pickers">
                <button class="date-picker" type="button" id="langYearPickerBtn" aria-haspopup="listbox"></button>
                <button class="date-picker" type="button" id="langMonthPickerBtn" aria-haspopup="listbox"></button>
                <button class="date-picker" type="button" id="langDayPickerBtn" aria-haspopup="listbox"></button>
              </div>
              <div class="picker-panel" id="langYearPickerPanel" hidden></div>
              <div class="picker-panel" id="langMonthPickerPanel" hidden></div>
              <div class="picker-panel" id="langDayPickerPanel" hidden></div>
            </div>

            <div class="memo-field">
              <span class="memo-label">시간</span>
              <div class="time-pickers">
                <label class="time-field">
                  <span>시작</span>
                  <input id="langStartTime" type="time" required>
                </label>
                <label class="time-field">
                  <span>종료</span>
                  <input id="langEndTime" type="time" required>
                </label>
              </div>
            </div>

            <div class="memo-field">
              <span class="memo-label">분류</span>
              <button class="category-trigger" type="button" id="langCategoryBtn">
                <span class="category-dot is-empty" id="langCategoryDot"></span>
                <span id="langCategoryLabel">분류 선택</span>
              </button>
              <div class="category-panel" id="langCategoryPanel" hidden></div>
            </div>

            <div class="memo-field memo-field--grow">
              <label class="memo-label" for="langBody">메모 작성</label>
              <textarea id="langBody" placeholder="메모를 작성하세요" rows="8"></textarea>
            </div>
          </form>
        </div>
      </div>

      <div class="home-section" id="sectionEconomy">
      <div class="home-main" id="calendarView">
        <aside class="side-panel" aria-label="표 영역">
          <div class="side-panel__box side-panel__box--rate" id="achieveBox">
            <div class="side-box-head">
              <h2 class="side-box-title">달성률</h2>
            </div>
            <div class="achieve-body">
              <p class="achieve-percent"><span id="achievePercent">0</span>%</p>
              <p class="achieve-count" id="achieveCount">0일 / 0일</p>
              <div class="achieve-bar" aria-hidden="true">
                <div class="achieve-bar__fill" id="achieveBarFill"></div>
              </div>
            </div>
          </div>
          <div class="side-panel__box side-panel__box--chart" id="chartBox">
            <div class="side-box-head">
              <h2 class="side-box-title">통계</h2>
            </div>
            <div class="chart-body" id="chartBody"></div>
          </div>
        </aside>
        <div class="home-right">
          <div class="calendar" id="calendar" aria-label="캘린더">
            <div class="calendar-header">
              <button class="calendar-nav" type="button" id="calendarPrev" aria-label="이전 달">‹</button>
              <h1 class="calendar-title" id="calendarTitle"></h1>
              <button class="calendar-nav" type="button" id="calendarNext" aria-label="다음 달">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>일</span>
              <span>월</span>
              <span>화</span>
              <span>수</span>
              <span>목</span>
              <span>금</span>
              <span>토</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
          <div class="day-detail" id="dayDetail">
            <p class="day-detail__hint" id="dayDetailHint">날짜를 선택하면 저장된 내용이 여기에 표시됩니다.</p>
            <div class="day-detail__content" id="dayDetailContent" hidden>
              <h2 class="day-detail__title" id="dayDetailTitle"></h2>
              <div class="day-detail__list" id="dayDetailList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="memo-view" id="memoView" hidden>
        <header class="memo-top">
          <button class="btn-text" type="button" id="memoBackBtn">닫기</button>
          <div class="memo-actions">
            <button class="btn-action" type="button" id="draftListBtn">저장목록</button>
            <span class="memo-actions__sep" aria-hidden="true">|</span>
            <button class="btn-action" type="button" id="draftSaveBtn">임시저장</button>
            <span class="memo-actions__sep" aria-hidden="true">|</span>
            <button class="btn-action is-strong" type="button" id="memoSaveBtn">저장</button>
          </div>
        </header>

        <form class="memo-form" id="memoForm">
          <div class="memo-field">
            <span class="memo-label">날짜</span>
            <div class="date-pickers">
              <button class="date-picker" type="button" id="yearPickerBtn" aria-haspopup="listbox"></button>
              <button class="date-picker" type="button" id="monthPickerBtn" aria-haspopup="listbox"></button>
              <button class="date-picker" type="button" id="dayPickerBtn" aria-haspopup="listbox"></button>
            </div>
            <div class="picker-panel" id="yearPickerPanel" hidden></div>
            <div class="picker-panel" id="monthPickerPanel" hidden></div>
            <div class="picker-panel" id="dayPickerPanel" hidden></div>
          </div>

          <div class="memo-field">
            <label class="memo-label" for="memoUrl">URL</label>
            <input id="memoUrl" type="url" inputmode="url" placeholder="https://" autocomplete="off">
          </div>

          <div class="memo-field">
            <span class="memo-label">분류</span>
            <button class="category-trigger" type="button" id="categoryBtn">
              <span class="category-dot is-empty" id="categoryDot"></span>
              <span id="categoryLabel">분류 선택</span>
            </button>
            <div class="category-panel" id="categoryPanel" hidden></div>
          </div>

          <div class="memo-field memo-field--grow">
            <label class="memo-label" for="memoBody">메모 작성</label>
            <textarea id="memoBody" placeholder="메모를 작성하세요" rows="8"></textarea>
          </div>
        </form>
      </div>
      </div>
    </section>

    <div class="sheet" id="draftSheet" hidden>
      <div class="sheet-backdrop" id="draftSheetBackdrop"></div>
      <div class="sheet-panel" role="dialog" aria-labelledby="draftSheetTitle">
        <div class="sheet-header">
          <h2 class="sheet-title" id="draftSheetTitle">저장목록</h2>
          <button class="btn-text" type="button" id="draftSheetClose">닫기</button>
        </div>
        <div class="draft-list" id="draftList"></div>
      </div>
    </div>

    <div class="sheet" id="langDraftSheet" hidden>
      <div class="sheet-backdrop" id="langDraftSheetBackdrop"></div>
      <div class="sheet-panel" role="dialog" aria-labelledby="langDraftSheetTitle">
        <div class="sheet-header">
          <h2 class="sheet-title" id="langDraftSheetTitle">저장목록</h2>
          <button class="btn-text" type="button" id="langDraftSheetClose">닫기</button>
        </div>
        <div class="draft-list" id="langDraftList"></div>
      </div>
    </div>

    <div class="sheet" id="routineSheet" hidden>
      <div class="sheet-backdrop" id="routineSheetBackdrop"></div>
      <div class="sheet-panel" role="dialog" aria-labelledby="routineSheetTitle">
        <div class="sheet-header">
          <h2 class="sheet-title" id="routineSheetTitle">루틴 추가</h2>
          <button class="btn-text" type="button" id="routineSheetClose">닫기</button>
        </div>
        <form class="routine-form" id="routineForm">
          <label class="memo-label" for="routineTitleInput">루틴 이름</label>
          <input id="routineTitleInput" type="text" maxlength="40" placeholder="예: 아침 스트레칭" required>
          <button class="btn-primary" type="submit">추가</button>
        </form>
      </div>
    </div>

    <p class="toast" id="toast" hidden></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="accounts.js?v=262"></script>
  <script src="script.js?v=262"></script>
</body>
</html>
