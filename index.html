<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="kitegamemode">
  <title>kitegamemode.kr</title>
  <link rel="canonical" href="https://kitegamemode.kr/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=221">
</head>
<body>
  <main class="app">
    <section class="page login-page" id="loginPage">
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="loginId">아이디</label>
          <input id="loginId" type="text" autocomplete="username" placeholder="아이디" required>
        </div>
        <div class="login-field">
          <label for="loginPassword">비밀번호</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        </div>
        <p class="login-error" id="loginError" hidden>잘못입력하셨습니다</p>
        <button class="btn-primary" type="submit">로그인</button>
      </form>
    </section>

    <section class="page home-page" id="homePage" hidden>
      <header class="page-top">
        <p class="page-role" id="homeLabel"></p>
        <button class="btn-text" type="button" id="logoutBtn">로그아웃</button>
      </header>
      <div class="home-blank" id="homeBlank"></div>
    </section>
  </main>
  <script src="accounts.js?v=221"></script>
  <script src="script.js?v=221"></script>
</body>
</html>
