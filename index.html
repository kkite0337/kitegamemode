<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="kitegamemode">
  <title>kitegamemode.kr</title>
  <link rel="canonical" href="https://kitegamemode.kr/">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css?v=239">
</head>
<body>
  <main class="app">
    <section class="page login-page" id="loginPage">
      <form id="loginForm" class="login-form">
        <div class="login-field">
          <label for="loginId">아이디</label>
          <input id="loginId" type="text" autocomplete="username" placeholder="아이디" required>
        </div>
        <div class="login-field">
          <label for="loginPassword">비밀번호</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        </div>
        <p class="login-error" id="loginError" hidden>잘못입력하셨습니다</p>
        <button class="btn-primary" type="submit">로그인</button>
      </form>
    </section>

    <section class="page home-page" id="homePage" hidden>
      <header class="page-top" id="homeHeader">
        <div class="page-top-left">
          <p class="page-role" id="homeLabel"></p>
          <button class="btn-text" type="button" id="logoutBtn">로그아웃</button>
        </div>
        <div class="page-top-right">
          <button class="btn-plus" type="button" id="addMemoBtn" aria-label="메모 추가">+</button>
          <button class="btn-pdf" type="button" id="pdfBtn">PDF</button>
        </div>
      </header>

      <div class="home-main" id="calendarView">
        <aside class="side-panel" aria-label="표 영역">
          <div class="side-panel__box side-panel__box--rate" id="achieveBox">
            <div class="side-box-head">
              <h2 class="side-box-title">달성률</h2>
              <p class="side-box-month" id="achieveMonth"></p>
            </div>
            <div class="achieve-body">
              <p class="achieve-percent"><span id="achievePercent">0</span>%</p>
              <p class="achieve-count" id="achieveCount">0일 / 0일</p>
              <div class="achieve-bar" aria-hidden="true">
                <div class="achieve-bar__fill" id="achieveBarFill"></div>
              </div>
              <p class="achieve-note">메모를 작성한 날을 달성일로 계산합니다.</p>
            </div>
          </div>
          <div class="side-panel__box side-panel__box--chart" id="chartBox">
            <div class="side-box-head">
              <h2 class="side-box-title">원형 도표</h2>
              <p class="side-box-month" id="chartMonth"></p>
            </div>
            <div class="chart-body" id="chartBody"></div>
          </div>
        </aside>
        <div class="home-right">
          <div class="calendar" id="calendar" aria-label="캘린더">
            <div class="calendar-header">
              <button class="calendar-nav" type="button" id="calendarPrev" aria-label="이전 달">‹</button>
              <h1 class="calendar-title" id="calendarTitle"></h1>
              <button class="calendar-nav" type="button" id="calendarNext" aria-label="다음 달">›</button>
            </div>
            <div class="calendar-weekdays" aria-hidden="true">
              <span>일</span>
              <span>월</span>
              <span>화</span>
              <span>수</span>
              <span>목</span>
              <span>금</span>
              <span>토</span>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
          <div class="day-detail" id="dayDetail">
            <p class="day-detail__hint" id="dayDetailHint">날짜를 선택하면 저장된 내용이 여기에 표시됩니다.</p>
            <div class="day-detail__content" id="dayDetailContent" hidden>
              <h2 class="day-detail__title" id="dayDetailTitle"></h2>
              <div class="day-detail__list" id="dayDetailList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="memo-view" id="memoView" hidden>
        <header class="memo-top">
          <button class="btn-text" type="button" id="memoBackBtn">닫기</button>
          <div class="memo-actions">
            <button class="btn-action" type="button" id="draftListBtn">저장목록</button>
            <span class="memo-actions__sep" aria-hidden="true">|</span>
            <button class="btn-action" type="button" id="draftSaveBtn">임시저장</button>
            <span class="memo-actions__sep" aria-hidden="true">|</span>
            <button class="btn-action is-strong" type="button" id="memoSaveBtn">저장</button>
          </div>
        </header>

        <form class="memo-form" id="memoForm">
          <div class="memo-field">
            <span class="memo-label">날짜</span>
            <div class="date-pickers">
              <button class="date-picker" type="button" id="yearPickerBtn" aria-haspopup="listbox"></button>
              <button class="date-picker" type="button" id="monthPickerBtn" aria-haspopup="listbox"></button>
              <button class="date-picker" type="button" id="dayPickerBtn" aria-haspopup="listbox"></button>
            </div>
            <div class="picker-panel" id="yearPickerPanel" hidden></div>
            <div class="picker-panel" id="monthPickerPanel" hidden></div>
            <div class="picker-panel" id="dayPickerPanel" hidden></div>
          </div>

          <div class="memo-field">
            <label class="memo-label" for="memoUrl">URL</label>
            <input id="memoUrl" type="url" inputmode="url" placeholder="https://" autocomplete="off">
          </div>

          <div class="memo-field">
            <span class="memo-label">분류</span>
            <button class="category-trigger" type="button" id="categoryBtn">
              <span class="category-dot is-empty" id="categoryDot"></span>
              <span id="categoryLabel">분류 선택</span>
            </button>
            <div class="category-panel" id="categoryPanel" hidden></div>
          </div>

          <div class="memo-field memo-field--grow">
            <label class="memo-label" for="memoBody">메모 작성</label>
            <textarea id="memoBody" placeholder="메모를 작성하세요" rows="8"></textarea>
          </div>
        </form>
      </div>
    </section>

    <div class="sheet" id="draftSheet" hidden>
      <div class="sheet-backdrop" id="draftSheetBackdrop"></div>
      <div class="sheet-panel" role="dialog" aria-labelledby="draftSheetTitle">
        <div class="sheet-header">
          <h2 class="sheet-title" id="draftSheetTitle">저장목록</h2>
          <button class="btn-text" type="button" id="draftSheetClose">닫기</button>
        </div>
        <div class="draft-list" id="draftList"></div>
      </div>
    </div>

    <p class="toast" id="toast" hidden></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <script src="accounts.js?v=239"></script>
  <script src="script.js?v=239"></script>
</body>
</html>
